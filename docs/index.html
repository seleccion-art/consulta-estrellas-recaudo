<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reconocimientos - Recaudo Bogotá</title>

  <!-- Fuentes de Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Librería de Confeti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #334155;
    }

    .main-container {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      position: relative;
    }

    .header-banner {
      background: linear-gradient(135deg, #1e1b4b 0%, #311042 100%);
      padding: 30px 24px 20px 24px;
      text-align: center;
      color: #ffffff;
      position: relative;
    }

    .brand-logo {
      max-width: 180px;
      height: auto;
      margin-bottom: 15px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
    }

    .header-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #fbbf24;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .header-subtitle {
      font-size: 0.85rem;
      font-weight: 500;
      color: #cbd5e1;
    }

    .search-section {
      padding: 24px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }

    .input-group {
      display: flex;
      gap: 10px;
      position: relative;
    }

    .search-input {
      flex: 1;
      padding: 14px 18px;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #0f172a;
      outline: none;
      transition: all 0.20s ease;
      background: #ffffff;
    }

    .search-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }

    .btn-search {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: #ffffff;
      border: none;
      padding: 0 22px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .btn-search:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
    }

    .btn-clear {
      background: #e2e8f0;
      color: #475569;
      border: none;
      padding: 0 14px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: none;
      transition: all 0.2s ease;
    }

    .btn-clear:hover {
      background: #cbd5e1;
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 8px;
      margin-left: 4px;
    }

    .results-section {
      padding: 24px;
    }

    .profile-card {
      background: #ffffff;
    }

    .profile-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .profile-badge-tag {
      background: #e0e7ff;
      color: #3730a3;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: 0.8px;
      display: inline-block;
      margin-bottom: 8px;
    }

    .profile-name {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0f172a;
      text-transform: uppercase;
      margin-bottom: 16px;
      line-height: 1.3;
    }

    .stars-yellow-card {
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
      border: 2px solid #f59e0b;
      border-radius: 18px;
      padding: 14px;
      text-align: center;
      box-shadow: 0 8px 16px -4px rgba(245, 158, 11, 0.2);
    }

    .stars-label {
      font-size: 0.75rem;
      font-weight: 800;
      color: #92400e;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 4px;
    }

    .stars-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .star-icon {
      font-size: 1.8rem;
    }

    .stars-number {
      font-size: 2.2rem;
      font-weight: 900;
      color: #78350f;
      line-height: 1;
    }

    .mensaje-box {
      background: #f1f5f9;
      border-radius: 14px;
      padding: 14px;
      font-size: 0.82rem;
      color: #334155;
      line-height: 1.5;
      text-align: center;
      margin-bottom: 20px;
      border-left: 4px solid #6366f1;
    }

    .badges-section {
      margin-top: 15px;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 12px;
    }

    .categorias-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .badge-star {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #f8fafc;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }

    .star-badge-icon {
      width: 28px;
      height: 28px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .badge-star span {
      font-size: 0.85rem;
      font-weight: 600;
      color: #1e293b;
    }

    .empty-state-card {
      text-align: center;
      padding: 10px 0;
    }

    .empty-logo-wrapper {
      margin-bottom: 15px;
    }

    .empty-logo {
      max-width: 140px;
      height: auto;
    }

    .empty-state-card h3 {
      font-size: 1.1rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 10px;
    }

    .empty-state-card p {
      font-size: 0.85rem;
      color: #475569;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .motto-tag {
      font-size: 0.8rem;
      font-weight: 700;
      color: #6366f1;
      font-style: italic;
    }

    .fade-in {
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="header-banner">
      <img src="img/logo-recaudo.png" alt="Recaudo Bogotá" class="brand-logo" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/1828/1828884.png';">
      <h1 class="header-title">Programa Estrellas</h1>
      <p class="header-subtitle">Consulta tus reconocimientos e incentivos</p>
    </div>

    <div class="search-section">
      <div class="input-group">
        <input type="text" id="cedula" class="search-input" placeholder="Ingresa tu número de cédula..." onkeypress="if(event.key === 'Enter') buscar()">
        <button class="btn-search" onclick="buscar()">Buscar</button>
        <button id="btn-limpiar" class="btn-clear" onclick="limpiar()">Limpiar</button>
      </div>
      <div id="error" class="error-msg"></div>
    </div>

    <div class="results-section" id="resultado"></div>
  </div>

  <script>
    let datos = [];

    // Cargar el archivo JSON
    fetch('data.json')
      .then(res => res.json())
      .then(json => datos = json)
      .catch(err => console.error('Error al cargar data.json:', err));

    function lanzarEstrellas() {
      const defaults = {
        spread: 360,
        ticks: 80,
        gravity: 0.6,
        decay: 0.94,
        startVelocity: 30,
        shapes: ['star'],
        colors: ['FFE100', 'FFBD00', 'EAB308', 'A78BFA', '7C3AED']
      };

      function shoot() {
        confetti({ ...defaults, particleCount: 25, scalar: 1.2, shapes: ['star'] });
        confetti({ ...defaults, particleCount: 15, scalar: 0.75, shapes: ['circle'] });
      }

      setTimeout(shoot, 0);
      setTimeout(shoot, 150);
      setTimeout(shoot, 300);
    }

    function obtenerEstrella(categoria) {
      const cat = String(categoria).toLowerCase().trim();

      if (cat.includes('líder') || cat.includes('lider') || cat.includes('inspir') || 
          cat.includes('moviliz') || cat.includes('brigad') || cat.includes('proyectos especiales') || 
          cat.includes('convivencia') || cat.includes('copasst') || cat.includes('equipares') || 
          cat.includes('clima') || cat.includes('influencia') || cat.includes('antiguedad') || 
          cat.includes('antigüedad') || cat.includes('sostenibilidad') || cat.includes('eva. inversa') || 
          cat.includes('encuesta') || cat.includes('directiv') || cat.includes('jefe') || cat.includes('gerente')) {
        return { img: 'img/Lideres Inspiradores Que Movilizan.png', color: '#7c3aed' };
      }

      if (cat.includes('integridad') || cat.includes('honestidad') || cat.includes('respeto') || 
          cat.includes('equidad') || cat.includes('excelencia') || cat.includes('creatividad') || 
          cat.includes('esencia') || cat.includes('servicio')) {
        return { img: 'img/Esencia RB.png', color: '#0284c7' };
      }

      if (cat.includes('capacitación') || cat.includes('capacitacion') || cat.includes('curso') || 
          cat.includes('malla') || cat.includes('ubits') || cat.includes('semillero') || 
          cat.includes('escuela') || cat.includes('talento') || cat.includes('servicio rb') || 
          cat.includes('reconversión') || cat.includes('reconversion') || cat.includes('sarlaft') || 
          cat.includes('hse') || cat.includes('acoso') || cat.includes('seguridad') || 
          cat.includes('gobierno') || cat.includes('compras') || cat.includes('aportamos') || 
          cat.includes('ninja') || cat.includes('flow') || cat.includes('estrés') || cat.includes('estres') ||
          cat.includes('inteligencia') || cat.includes('ia') || cat.includes('empatia') || cat.includes('proactividad')) {
        return { img: 'img/Aprendemos y Aportamos en RB.png', color: '#dc2626' };
      }

      return { img: 'img/Colaboradores Estrella.png', color: '#eab308' };
    }

    function buscar() {
      const cedulaInput = document.getElementById('cedula');
      const cedula = cedulaInput.value.trim();
      const resultado = document.getElementById('resultado');
      const error = document.getElementById('error');
      const btnLimpiar = document.getElementById('btn-limpiar');

      resultado.innerHTML = '';
      error.innerHTML = '';

      if (!cedula) {
        error.textContent = 'Por favor, ingresa tu número de documento.';
        return;
      }

      btnLimpiar.style.display = 'block';

      // Buscar persona por cédula
      const persona = datos.find(p => String(p.cedula).trim() === String(cedula).trim());

      if (!persona) {
        resultado.innerHTML = `
          <div class="empty-state-card fade-in">
            <div class="empty-logo-wrapper">
              <img src="img/logo-recaudo.png" alt="Recaudo Bogotá" class="empty-logo" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/1828/1828884.png';">
            </div>
            <h3>¡Tu momento de brillar está cerca!</h3>
            <p>Aún no registras estrellas asignadas en el sistema, pero en <strong>Recaudo Bogotá</strong> confiamos en tu talento. Te invitamos a seguir dando lo mejor de ti, cumplir tus metas diarias y participar activamente en nuestras capacitaciones para que pronto recibas tus primeras estrellas de reconocimiento.</p>
            <span class="motto-tag">"Nos esforzamos para que las cosas pasen"</span>
          </div>
        `;
        return;
      }

      lanzarEstrellas();

      const mensaje = '¡Felicitaciones por tus logros! Por cada estrella que hayas ganado, te cargaremos 1.000 puntos en RB Contigo para que puedas redimirlos en cualquier comercio aliado en la plataforma.';

      // Obtener lista de reconocimientos/categorías
      const listaReconocimientos = persona.reconocimientos || persona.categorias || [];
      const reconocimientosValidos = Array.isArray(listaReconocimientos) 
        ? listaReconocimientos.filter(c => c && String(c).trim() !== '')
        : [];

      // Rescatar el total de estrellas si viene en 0 o vacio
      const totalEstrellas = (persona.total && Number(persona.total) > 0) 
        ? persona.total 
        : reconocimientosValidos.length;

      let reconocimientosHTML = '';
      if (reconocimientosValidos.length > 0) {
        reconocimientosValidos.forEach(cat => {
          const estrella = obtenerEstrella(cat);
          reconocimientosHTML += `
            <div class="badge-star" style="border-left: 4px solid ${estrella.color};">
              <img src="${estrella.img}" alt="Estrella" class="star-badge-icon" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/1828/1828884.png';">
              <span>${cat}</span>
            </div>
          `;
        });
      } else {
        reconocimientosHTML = '<p style="color: #64748b; font-size: 0.85rem;">Sin reconocimientos registrados.</p>';
      }

      resultado.innerHTML = `
        <div class="profile-card fade-in">
          <div class="profile-header">
            <div class="profile-top-bar">
              <span class="profile-badge-tag">COLABORADOR(A) RECONOCIDO(A)</span>
            </div>
            
            <h2 class="profile-name">${persona.nombre}</h2>
            
            <div class="stars-yellow-card">
              <span class="stars-label">TOTAL DE ESTRELLAS</span>
              <div class="stars-badge">
                <span class="star-icon">⭐</span>
                <span class="stars-number">${totalEstrellas}</span>
              </div>
            </div>
          </div>

          <div class="mensaje-box">${mensaje}</div>

          <div class="badges-section">
            <p class="section-title">Reconocimientos asignados a la fecha:</p>
            <div class="categorias-grid">
              ${reconocimientosHTML}
            </div>
          </div>
        </div>
      `;
    }

    function limpiar() {
      document.getElementById('cedula').value = '';
      document.getElementById('resultado').innerHTML = '';
      document.getElementById('error').innerHTML = '';
      document.getElementById('btn-limpiar').style.display = 'none';
      document.getElementById('cedula').focus();
    }
  </script>
</body>
</html>
