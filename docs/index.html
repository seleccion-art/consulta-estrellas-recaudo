<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Estrellas – Recaudo Bogotá</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="app-card">
    
    <!-- Encabezado Corporativo -->
    <header class="card-header">
      <img src="img/logo-recaudo.png" alt="Recaudo Bogotá" class="header-logo-img">
      <h1 class="header-title">CONSULTA DE ESTRELLAS</h1>
      <p class="company-name">Recaudo Bogotá</p>
    </header>

    <div class="card-body">
      
      <!-- Formulario de Búsqueda -->
      <div class="search-form">
        <label for="cedula" class="input-label">Número de documento</label>
        <div class="input-group">
          <i class="fa-solid fa-id-card input-icon"></i>
          <input type="text" id="cedula" placeholder="Ingresa tu cédula">
        </div>
        <button type="button" onclick="buscar()" class="btn-primary">
          <i class="fa-solid fa-magnifying-glass"></i> Consultar
        </button>
      </div>

      <!-- Mensaje de Error / Campo Vacío -->
      <div id="error" class="error-message"></div>

      <!-- Contenedor Dinámico de Resultados -->
      <div id="resultado"></div>

    </div>

    <!-- Pie de página -->
    <footer class="card-footer">
      <i class="fa-solid fa-shield-halved"></i> Información tomada de la base oficial de reconocimientos
    </footer>

  </main>

  <script>
  let datos = [];

  fetch('data.json')
    .then(res => res.json())
    .then(json => datos = json)
    .catch(err => console.error('Error al cargar data.json:', err));

  function obtenerEstrella(categoria) {
    const cat = categoria.toLowerCase().trim();

    // 1. ESTRELLA AZUL: ESENCIA RB
    // Palabras clave: servicio rb, equidad, diversidad, inclusión, esencia, integridades, adn
    if (cat.includes('servicio rb') || cat.includes('equidad') || cat.includes('diversidad') || 
        cat.includes('inclusión') || cat.includes('esencia') || cat.includes('adn') || 
        cat.includes('humano') || cat.includes('valores')) {
      return { img: 'img/estrella-azul.png', color: '#0284c7' };
    }

    // 2. ESTRELLA ROJA: APRENDEMOS Y APORTAMOS EN RB
    // Palabras clave: capacitación, curso, hse, sarlaft, seguridad, malla, ubits, semillero, brigadistas, acoso, compras
    if (cat.includes('capacitación') || cat.includes('capacitacion') || cat.includes('curso') || 
        cat.includes('hse') || cat.includes('sarlaft') || cat.includes('seguridad') || 
        cat.includes('malla') || cat.includes('ubits') || cat.includes('semillero') || 
        cat.includes('brigadistas') || cat.includes('acoso') || cat.includes('compras') || cat.includes('gobierno')) {
      return { img: 'img/estrella-roja.png', color: '#dc2626' };
    }

    // 3. ESTRELLA MORADA: LÍDERES INSPIRADORES QUE MOVILIZAN
    // Palabras clave: lider, líder, jefes, evaluacion, movilizan, inverso
    if (cat.includes('lider') || cat.includes('líder') || cat.includes('jefe') || cat.includes('movilizan')) {
      return { img: 'img/estrella-morada.png', color: '#7c3aed' };
    }

    // 4. ESTRELLA AMARILLA: COLABORADORES ESTRELLA RB
    // Palabras clave: influencia positiva, sostenibilidad, antiguedad, antigüedades, desempeño, reconocimiento general
    return { img: 'img/estrella-amarilla.png', color: '#eab308' };
  }

  function buscar() {
    const cedula = document.getElementById('cedula').value.trim();
    const resultado = document.getElementById('resultado');
    const error = document.getElementById('error');

    resultado.innerHTML = '';
    error.innerHTML = '';

    if (!cedula) {
      error.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Por favor, ingresa un número de documento.';
      return;
    }

    const persona = datos.find(p => String(p.cedula).trim() === String(cedula).trim());

    if (!persona) {
      error.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> No se encontraron registros para este documento.';
      return;
    }

    const mensaje = 'Gracias por tu compromiso y participación. Por cada estrella que hayas ganado, te cargaremos 1.000 puntos en RB Contigo para que puedas redimirlos en cualquier comercio aliado en la plataforma.';

    // Filtra elementos vacíos como "" o espacios en blanco
    const categoriasValidas = (persona.categorias || []).filter(c => c && c.trim() !== '');

    let categoriasHTML = '';
    if (categoriasValidas.length > 0) {
      categoriasValidas.forEach(cat => {
        const estrella = obtenerEstrella(cat);
        categoriasHTML += `
          <div class="badge-star" style="border-left: 4px solid ${estrella.color};">
            <img src="${estrella.img}" alt="Estrella" class="star-badge-icon" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/1828/1828884.png';">
            <span>${cat}</span>
          </div>
        `;
      });
    } else {
      categoriasHTML = '<p style="color: #64748b; font-size: 0.85rem;">Sin categorías registradas.</p>';
    }

    resultado.innerHTML = `
      <div class="results-grid">
        <div class="left-col">
          <section class="user-profile">
            <div class="user-info">
              <span class="user-label">Nombre:</span>
              <span class="user-value">${persona.nombre}</span>
            </div>
            <div class="user-info">
              <span class="user-label">Cargo:</span>
              <span class="user-value">${persona.cargo}</span>
            </div>
          </section>
        </div>

        <div class="right-col">
          <section class="stars-hero">
            <div class="stars-title">ESTRELLAS ACUMULADAS</div>
            <div class="stars-score">
              <span class="score-number">${persona.total}</span>
            </div>
            <p class="stars-description">${mensaje}</p>
          </section>
        </div>

        <div class="col-full">
          <section class="badges-section">
            <h2 class="section-title">Categorías reconocidas:</h2>
            <div class="badges-grid">
              ${categoriasHTML}
            </div>
          </section>
        </div>
      </div>
    `;
  }
</script>

</body>
</html>
